name: InventisBio
description: >-
  InventisBio Co., Ltd. (Shanghai Stock Exchange STAR Market: 688382) is a
  clinical-stage biopharmaceutical company headquartered in the Pudong New Area
  of Shanghai, China, with operations in New Jersey, United States. Built on
  independent R&D capabilities, InventisBio discovers and develops innovative
  small-molecule and targeted therapies for oncology, autoimmune, and metabolic
  diseases to address unmet medical needs. The company has advanced multiple
  drug candidates into clinical trials, including late-stage Phase III programs
  in non-small cell lung cancer and breast cancer, alongside earlier-stage
  assets targeting KRAS G12C, synthetic-lethal pathways, hyperuricemia/gout, and
  plaque psoriasis. It was added to the API Evangelist network as a portfolio
  company of Qiming Venture Partners. InventisBio is a research-driven
  pharmaceutical company and does not currently publish a public developer API,
  SDKs, or API documentation.
